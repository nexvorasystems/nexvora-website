name: Daily Blog Post Generator

on:
  schedule:
    # 6:00 AM PDT = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview articles without publishing or changing Notion'
        type: boolean
        default: true

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test article generation
        run: node --test scripts/test/openai-text.test.js

      - name: Generate post(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WRITER_MODEL: ${{ vars.OPENAI_WRITER_MODEL || 'gpt-6-luna' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6-luna' }}
          BLOG_DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: node scripts/generate-post.js

      - name: Upload article previews
        if: inputs.dry_run || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: .preview/
          retention-days: 7

      - name: Commit and push new post(s)
        if: "!inputs.dry_run && github.ref == 'refs/heads/main'"
        run: |
          git config user.name "Nexvora Content Bot"
          git config user.email "bot@nexvorasystems.us"
          git add posts/ blog.html assets/blog/
          git diff --staged --quiet || git commit -m "content: auto-generate daily post $(date +'%Y-%m-%d')"
          git push
