<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* white ground; neutrals carry a slight cool bias toward the navy/teal accent */
  --bg:#FFFFFF; --surface:#F6F8FA; --card:#FFFFFF;
  --border:#E1E6EC; --border-soft:#EDF1F5;
  --ink:#101722; --ink-2:#48566B; --ink-3:#7A8899;
  --navy:#0F2B4C; --teal:#0D7A70; --teal-ink:#0D7A70;
  --teal-soft:rgba(13,148,136,.08); --teal-line:rgba(13,148,136,.30);
  --crit:#C7382F; --crit-bg:#FDF2F1; --crit-line:#F4CCC8;
  --high:#B45A0B; --high-bg:#FDF6EE; --high-line:#F3DCC1;
  --med:#8A6A12;  --med-bg:#FCF9EC;  --med-line:#EEE2BA;
  --ok:#0B7A55;   --ok-bg:#EFFAF5;   --ok-line:#BAE7D3;
  --shadow:0 1px 2px rgba(16,23,34,.04),0 6px 18px rgba(16,23,34,.05);
  --radius:14px;
  --rail:236px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#171D25; --card:#1A212B;
    --border:#2B3542; --border-soft:#232C37;
    --ink:#E7EBF0; --ink-2:#A3AEBD; --ink-3:#778393;
    --navy:#9DC0E8; --teal:#3EC8B7; --teal-ink:#3EC8B7;
    --teal-soft:rgba(62,200,183,.12); --teal-line:rgba(62,200,183,.34);
    --crit:#F08A80; --crit-bg:rgba(199,56,47,.13); --crit-line:rgba(240,138,128,.30);
    --high:#EDA85C; --high-bg:rgba(180,90,11,.14); --high-line:rgba(237,168,92,.30);
    --med:#DCC46A;  --med-bg:rgba(138,106,18,.15); --med-line:rgba(220,196,106,.28);
    --ok:#5FCB9B;   --ok-bg:rgba(11,122,85,.15);   --ok-line:rgba(95,203,155,.28);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#171D25; --card:#1A212B;
  --border:#2B3542; --border-soft:#232C37;
  --ink:#E7EBF0; --ink-2:#A3AEBD; --ink-3:#778393;
  --navy:#9DC0E8; --teal:#3EC8B7; --teal-ink:#3EC8B7;
  --teal-soft:rgba(62,200,183,.12); --teal-line:rgba(62,200,183,.34);
  --crit:#F08A80; --crit-bg:rgba(199,56,47,.13); --crit-line:rgba(240,138,128,.30);
  --high:#EDA85C; --high-bg:rgba(180,90,11,.14); --high-line:rgba(237,168,92,.30);
  --med:#DCC46A;  --med-bg:rgba(138,106,18,.15); --med-line:rgba(220,196,106,.28);
  --ok:#5FCB9B;   --ok-bg:rgba(11,122,85,.15);   --ok-line:rgba(95,203,155,.28);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.28);
}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15.5px;line-height:1.62}
h1,h2,h3,h4,.cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
a{color:var(--teal-ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

/* ═══ SHELL ═══ */
.topbar{position:sticky;top:0;z-index:120;display:flex;align-items:center;gap:14px;
  padding:13px 26px;background:var(--bg);border-bottom:1px solid var(--border)}
.tb-brand{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:-.2px;color:var(--navy);white-space:nowrap}
.tb-brand em{font-style:normal;color:var(--teal-ink)}
.tb-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--teal-ink);border:1px solid var(--teal-line);
  background:var(--teal-soft);padding:3px 9px;border-radius:100px;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.tb-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-prog{width:96px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.tb-prog span{display:block;height:100%;background:var(--teal);width:0;transition:width .35s ease}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start;
  max-width:1180px;margin:0 auto;gap:0}

/* ═══ RAIL ═══ */
.rail{position:sticky;top:53px;max-height:calc(100vh - 53px);overflow-y:auto;
  padding:30px 18px 40px 26px;border-right:1px solid var(--border)}
.rail-h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.rail-list{list-style:none;display:flex;flex-direction:column;gap:1px}
.rail-list a{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:baseline;
  padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink-2);
  font-size:13.5px;line-height:1.35;transition:background .15s,color .15s}
.rail-list a:hover{background:var(--surface);color:var(--ink)}
.rail-list a .rn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.rail-list a.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.rail-list a.on .rn{color:var(--teal-ink)}
.rail-sep{height:1px;background:var(--border);margin:11px 9px}

/* ═══ PAGES ═══ */
.stage{padding:44px 40px 80px;min-width:0}
.page{display:none}
.page.on{display:flex;flex-direction:column;gap:26px;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .page.on{animation:none}
  .tb-prog span{transition:none}
}

/* page opener */
.opener{display:flex;flex-direction:column;gap:14px;padding-bottom:8px;
  border-bottom:1px solid var(--border)}
.op-meta{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.op-num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--teal-ink)}
.op-rule{flex:1;height:1px;background:var(--teal-line);min-width:20px}
.page h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-1px;
  line-height:1.09;color:var(--ink)}
.thesis{font-size:17.5px;line-height:1.55;color:var(--ink-2);max-width:56ch}
.thesis strong{color:var(--ink);font-weight:600}

/* headline figure inside opener */
.keyfig{display:flex;align-items:baseline;gap:13px;padding:14px 0 2px;flex-wrap:wrap}
.keyfig .kv{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;
  line-height:1;letter-spacing:-2px;color:var(--navy);font-variant-numeric:tabular-nums}
.keyfig .kv.warn{color:var(--crit)}
.keyfig .kv.good{color:var(--ok)}
.keyfig .kl{font-size:13.5px;color:var(--ink-3);max-width:34ch;line-height:1.4}

h2{font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--ink);
  padding-bottom:8px;border-bottom:1px solid var(--border)}
h3{font-size:15.5px;font-weight:700;color:var(--ink)}
.lede{font-size:15.5px;color:var(--ink-2);max-width:66ch}
.lede strong{color:var(--ink);font-weight:600}
.blk{display:flex;flex-direction:column;gap:14px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;
  padding:2.5px 8px;border-radius:4px;white-space:nowrap;vertical-align:middle}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chip.ev{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.chip.gap{color:var(--ink-3);background:var(--surface);border:1px solid var(--border)}
.chip.inf{color:var(--med);background:var(--med-bg);border:1px solid var(--med-line)}

/* findings */
.findings{display:flex;flex-direction:column;gap:12px}
.finding{background:var(--card);border:1px solid var(--border-soft);
  border-left:3px solid var(--sev,var(--ink-3));border-radius:0 var(--radius) var(--radius) 0;
  padding:18px 21px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.finding.f-crit{--sev:var(--crit)}
.finding.f-high{--sev:var(--high)}
.finding.f-med{--sev:var(--med)}
.f-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--sev)}
.f-sev{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.9px;
  text-transform:uppercase;color:var(--sev);padding:2px 7px;border-radius:4px;
  border:1px solid currentColor;opacity:.9}
.f-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17.5px;
  letter-spacing:-.2px;line-height:1.3;color:var(--ink);width:100%}
.finding p{font-size:14.5px;color:var(--ink-2)}
.finding p strong{color:var(--ink);font-weight:600}
.quote{border-left:2px solid var(--teal-line);padding:2px 0 2px 14px;margin:2px 0;
  font-size:14px;color:var(--ink-2);font-style:italic;max-width:64ch}
.quote cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.f-fix{background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:9px;
  padding:11px 14px;font-size:14px;color:var(--ink-2)}
.f-fix b{font-family:'IBM Plex Sans Condensed',sans-serif;color:var(--teal-ink);font-size:12px;
  letter-spacing:1.1px;text-transform:uppercase;display:block;margin-bottom:3px}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
th{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;text-align:left;font-size:11.5px;
  letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);padding:11px 15px;
  border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
td{padding:11px 15px;border-bottom:1px solid var(--border-soft);color:var(--ink-2);vertical-align:top}
tr:last-child td{border-bottom:none}
td b,td strong{color:var(--ink);font-weight:600}
td.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);white-space:nowrap}
td.num,th.num{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
th.num{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:11.5px}
.dup{color:var(--crit);font-weight:600}
.keep{color:var(--ok);font-weight:600}

/* figure */
.figure{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:21px}
.fig-cap{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:12px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:17px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:152px 1fr 54px;gap:12px;align-items:center}
.bar-l{font-size:13px;color:var(--ink-2)}
.bar-t{height:18px;background:var(--surface);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;background:var(--teal);opacity:.85}
.bar-f.red{background:var(--crit)}
.bar-f.grey{background:var(--ink-3);opacity:.45}
.bar-v{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums}
.fig-note{margin-top:14px;font-size:12.5px;color:var(--ink-3)}

/* pipes */
.flowbox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:21px;display:flex;flex-direction:column;gap:20px}
.flowrow{display:flex;flex-direction:column;gap:10px}
.flowlabel{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--ink-3)}
.flowlabel.after{color:var(--teal-ink)}
.flowlabel.plain{letter-spacing:.3px;text-transform:none;font-size:12.5px}
.pipes{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pipe{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pipe.cut{color:var(--crit);border-color:var(--crit-line);background:var(--crit-bg);
  text-decoration:line-through;text-decoration-thickness:1px}
.pipe.keep{color:var(--teal-ink);border-color:var(--teal-line);background:var(--teal-soft);font-weight:500}
.arrow{color:var(--ink-3);font-size:13px;flex:none}

/* stages */
.stages{display:flex;flex-direction:column;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:var(--card)}
.stage-row{display:grid;grid-template-columns:32px 1fr 126px;gap:14px;padding:12px 16px;
  border-bottom:1px solid var(--border-soft);align-items:baseline}
.stage-row:last-child{border-bottom:none}
.stage-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.stage-name{font-size:14.5px;color:var(--ink)}
.stage-name span{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;
  color:var(--ink-3);margin-top:2px}
.stage-who{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);text-align:right}
.stage-row.bottleneck{background:var(--crit-bg)}
.stage-row.bottleneck .stage-who{color:var(--crit);font-weight:600}

/* asks */
.asks{display:flex;flex-direction:column;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden}
.ask{display:flex;gap:13px;padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--border-soft);font-size:14.5px;color:var(--ink-2)}
.ask:last-child{border-bottom:none}
.ask-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-ink);
  flex:none;padding-top:2px}
.ask b{color:var(--ink);font-weight:600}

/* phases */
.phases{display:flex;flex-direction:column;gap:12px}
.phase{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 21px;display:flex;flex-direction:column;gap:9px}
.phase-top{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.phase-when{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--teal-ink);border:1px solid var(--teal-line);
  background:var(--teal-soft);padding:2px 8px;border-radius:4px}
.phase-t{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:16.5px;
  color:var(--ink);letter-spacing:-.2px}
.phase ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.phase li{font-size:14.5px;color:var(--ink-2);padding-left:17px;position:relative}
.phase li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--teal-line)}

/* notice */
.notice{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--high);
  border-radius:0 10px 10px 0;padding:16px 20px;display:flex;flex-direction:column;gap:7px}
.notice.teal{border-left-color:var(--teal)}
.notice-h{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink)}
.notice p{font-size:14px;color:var(--ink-2);max-width:70ch}

/* rules grid */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rulecol{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px}
.rulecol h4{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:11px;font-weight:700}
.rulecol.do h4{color:var(--ok)}
.rulecol.dont h4{color:var(--crit)}
.rulecol ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.rulecol li{font-size:14px;color:var(--ink-2);padding-left:16px;position:relative;line-height:1.5}
.rulecol.do li::before{content:'+';position:absolute;left:0;color:var(--ok);font-weight:700}
.rulecol.dont li::before{content:'\2212';position:absolute;left:0;color:var(--crit);font-weight:700}

/* app teardown cards */
.apps{display:flex;flex-direction:column;gap:12px}
.app{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:17px 20px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow)}
.app-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.app-name{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:-.2px;color:var(--ink)}
.app-price{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.app-verdict{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  font-weight:600;letter-spacing:.9px;text-transform:uppercase;padding:2.5px 8px;border-radius:4px}
.app-verdict.cut{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.app-verdict.decide{color:var(--high);background:var(--high-bg);border:1px solid var(--high-line)}
.app-verdict.keep{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.app-cell{background:var(--surface);border-radius:9px;padding:11px 13px}
.app-cell h5{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
.app-cell p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.app-cell p b{color:var(--ink);font-weight:600}
.app-save{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ok);font-weight:600;
  font-variant-numeric:tabular-nums}
.app-save.none{color:var(--ink-3)}

/* savings roll-up */
.rollup{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.rollup-row{display:grid;grid-template-columns:1fr 110px;gap:14px;padding:13px 18px;
  border-bottom:1px solid var(--border-soft);align-items:baseline}
.rollup-row:last-child{border-bottom:none;background:var(--surface)}
.rollup-row span{font-size:14.5px;color:var(--ink-2)}
.rollup-row b{font-family:'IBM Plex Mono',monospace;font-size:14.5px;text-align:right;
  color:var(--ink);font-variant-numeric:tabular-nums}
.rollup-row:last-child span{font-weight:600;color:var(--ink)}
.rollup-row:last-child b{color:var(--ok);font-size:16px}

/* ═══ COVER ═══ */
/* must not restate display — .page/.page.on own visibility, and an equal-specificity
   display here would keep the cover on screen for every page */
.page.on.cover{gap:0}
.cover-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--teal-ink);display:flex;align-items:center;gap:11px;margin-bottom:20px}
.cover-eyebrow::after{content:'';flex:1;height:1px;background:var(--teal-line)}
.cover h1{font-size:clamp(34px,6vw,60px);font-weight:700;letter-spacing:-1.8px;line-height:1.04;margin-bottom:22px}
.cover .thesis{font-size:18.5px;max-width:58ch;margin-bottom:34px}
.cover-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:30px}
.cstat{background:var(--card);padding:17px 18px}
.cstat .n{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;line-height:1;
  letter-spacing:-1.4px;color:var(--navy);font-variant-numeric:tabular-nums}
.cstat .n.warn{color:var(--crit)}
.cstat .n.good{color:var(--ok)}
.cstat .l{margin-top:7px;font-size:11.5px;line-height:1.35;color:var(--ink-3)}
.cover-meta{display:flex;gap:34px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--border)}
.cover-meta div{font-size:11.5px;color:var(--ink-3)}
.cover-meta b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
  color:var(--ink);margin-top:3px}

/* ═══ CONTENTS ═══ */
.toc{display:flex;flex-direction:column;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:var(--card)}
.toc a{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;
  padding:15px 18px;text-decoration:none;border-bottom:1px solid var(--border-soft);
  transition:background .15s}
.toc a:last-child{border-bottom:none}
.toc a:hover{background:var(--surface)}
.toc .tn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal-ink);
  font-variant-numeric:tabular-nums}
.toc .tt{display:flex;flex-direction:column;gap:2px}
.toc .tt b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:16px;font-weight:700;
  color:var(--ink);letter-spacing:-.2px}
.toc .tt span{font-size:13px;color:var(--ink-3);line-height:1.4}

/* ═══ PAGER ═══ */
.pager{display:flex;gap:11px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.pgbtn{flex:1;min-width:190px;display:flex;flex-direction:column;gap:3px;padding:14px 17px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  text-decoration:none;transition:border-color .15s,background .15s;cursor:pointer;
  font-family:inherit;text-align:left}
.pgbtn:hover{border-color:var(--teal-line);background:var(--surface)}
.pgbtn small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--ink-3)}
.pgbtn b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15px;font-weight:700;
  color:var(--ink);letter-spacing:-.2px}
.pgbtn.nx{text-align:right;align-items:flex-end}
.pgbtn[hidden]{display:none}

/* ═══ RESPONSIVE ═══ */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--border);
    padding:16px 20px;overflow-x:auto}
  .rail-list{flex-direction:row;gap:6px}
  .rail-list a{grid-template-columns:auto;white-space:nowrap;padding:6px 11px;font-size:12.5px}
  .rail-list a .rn{display:none}
  .rail-sep{display:none}
  .rail-h{margin-bottom:10px}
  .stage{padding:28px 20px 64px}
}
@media (max-width:640px){
  .cover-stats{grid-template-columns:1fr 1fr}
  .rules{grid-template-columns:1fr}
  .stage-row{grid-template-columns:26px 1fr;gap:10px}
  .stage-who{grid-column:2;text-align:left;margin-top:-4px}
  .bar{grid-template-columns:106px 1fr 46px;gap:9px}
  .bar-l{font-size:12px}
  .toc a{grid-template-columns:32px 1fr;gap:11px}
  .cover-meta{gap:20px}
}

var ITER = 250000;
var GATE_KEY = 'nxv_ust2026002_pw';

function b64bytes(s) {
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptReport(pw) {
  var enc = new TextEncoder();
  var material = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // a wrong password fails GCM authentication and throws — that IS the check
  var plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64bytes(IV) }, key, b64bytes(BLOB));
  return new TextDecoder().decode(plain);
}

function revealReport(html) {
  document.getElementById('report-root').innerHTML = html;
  var g = document.getElementById('gate');
  g.style.transition = 'opacity .4s';
  g.style.opacity = '0';
  setTimeout(function () { g.style.display = 'none'; }, 400);
  var bar = document.createElement('div');
  bar.className = 'welcome';
  bar.innerHTML = '\u2713 Confidential report unlocked \u2014 UST-2026-002';
  document.body.prepend(bar);
  initReport();
}

async function checkGate() {
  var pw = document.getElementById('gate-pw').value.trim();
  var err = document.getElementById('gate-error');
  var busy = document.getElementById('gate-busy');
  var btn = document.getElementById('gate-btn');
  err.style.display = 'none';
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Open this report over https at nexvorasystems.us to sign in.';
    err.style.display = 'block';
    return;
  }
  busy.style.display = 'block';
  btn.disabled = true;
  try {
    var html = await decryptReport(pw);
    try { sessionStorage.setItem(GATE_KEY, pw); } catch (e) {}
    revealReport(html);
  } catch (e) {
    err.textContent = 'That password is not correct.';
    err.style.display = 'block';
    document.getElementById('gate-pw').style.borderColor = 'rgba(239,68,68,.6)';
  } finally {
    busy.style.display = 'none';
    btn.disabled = false;
  }
}

// real listeners, not inline attributes — the form makes Enter work natively
document.getElementById('gate-btn').addEventListener('click', checkGate);
document.getElementById('gate-form').addEventListener('submit', function (e) {
  e.preventDefault();
  checkGate();
});
(function () {
  var i = document.getElementById('gate-pw');
  i.addEventListener('focus', function () { i.style.borderColor = 'rgba(13,148,136,.7)'; });
  i.addEventListener('blur', function () { i.style.borderColor = 'rgba(255,255,255,.15)'; });
  var b = document.getElementById('gate-btn');
  b.addEventListener('mouseover', function () { b.style.opacity = '.85'; });
  b.addEventListener('mouseout', function () { b.style.opacity = '1'; });
  i.focus();
})();

// resume an unlocked session without asking again
(async function () {
  var pw = null;
  try { pw = sessionStorage.getItem(GATE_KEY); } catch (e) {}
  if (!pw || !window.crypto || !crypto.subtle) return;
  try { revealReport(await decryptReport(pw)); } catch (e) {
    try { sessionStorage.removeItem(GATE_KEY); } catch (e2) {}
  }
})();
</script>

<script>
// ── report navigation; runs only after the report markup is injected ────────
function initReport() {
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var rail = document.getElementById('rail');
  var toc = document.getElementById('toc');
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  var prevt = document.getElementById('prevt'), nextt = document.getElementById('nextt');
  var count = document.getElementById('pcount'), prog = document.getElementById('prog');
  var idx = 0;

  function label(p) { return p.getAttribute('data-short') || p.getAttribute('data-title'); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // build rail
  pages.forEach(function (p, i) {
    var a = document.createElement('a');
    a.href = '#' + p.id;
    a.innerHTML = '<span class="rn">' + (p.getAttribute('data-num') || '&middot;') + '</span><span>' + label(p) + '</span>';
    var li = document.createElement('li');
    li.appendChild(a);
    rail.appendChild(li);
    if (i === 1) { var s = document.createElement('li'); s.className = 'rail-sep'; rail.appendChild(s); }
  });
  var railLinks = rail.querySelectorAll('a');
  for (var r = 0; r < railLinks.length; r++) bindJump(railLinks[r], r);

  function bindJump(a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(i, true); });
  }
  function indexOfId(id) {
    for (var n = 0; n < pages.length; n++) if (pages[n].id === id) return n;
    return -1;
  }

  // build contents (sectors only — skip cover and contents itself)
  pages.forEach(function (p) {
    var num = p.getAttribute('data-num');
    if (!num) return;
    var thesis = p.querySelector('.thesis');
    var txt = thesis ? thesis.textContent.trim() : '';
    if (txt.length > 128) txt = txt.slice(0, 125).replace(/\s+\S*$/, '') + '…';
    var a = document.createElement('a');
    a.href = '#' + p.id;
    a.innerHTML = '<span class="tn">' + num + '</span>' +
      '<span class="tt"><b>' + p.getAttribute('data-title') + '</b><span>' + txt + '</span></span>';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var i = indexOfId(this.getAttribute('href').slice(1));
      if (i > -1) show(i, true);
    });
    toc.appendChild(a);
  });

  function show(i, push) {
    if (i < 0 || i >= pages.length) return;
    idx = i;
    pages.forEach(function (p, n) { p.classList.toggle('on', n === i); });
    for (var k = 0; k < railLinks.length; k++) railLinks[k].classList.toggle('on', k === i);

    if (i > 0) { prev.hidden = false; prevt.textContent = label(pages[i - 1]); }
    else { prev.hidden = true; }
    if (i < pages.length - 1) { next.hidden = false; nextt.textContent = label(pages[i + 1]); }
    else { next.hidden = true; }

    count.textContent = pad(i + 1) + ' / ' + pad(pages.length);
    prog.style.width = ((i + 1) / pages.length * 100) + '%';

    // deep links are a convenience; some hosts (data: URLs, sandboxes) reject history writes
    if (push) {
      try {
        if (location.hash !== '#' + pages[i].id) history.replaceState(null, '', '#' + pages[i].id);
      } catch (e) { /* navigation still works without the hash */ }
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function byHash() {
    var i = indexOfId(location.hash.replace('#', ''));
    show(i > -1 ? i : 0, false);
  }

  prev.addEventListener('click', function () { show(idx - 1, true); });
  next.addEventListener('click', function () { show(idx + 1, true); });
  window.addEventListener('hashchange', byHash);
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { show(idx + 1, true); }
    if (e.key === 'ArrowLeft') { show(idx - 1, true); }
  });

  byHash();
})();
}
