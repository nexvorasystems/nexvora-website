<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Audit — U.S. Tax IQ | Nexvora Systems</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Confidential operations audit prepared by Nexvora Systems for U.S. Tax IQ Ltd. Report UST-2026-002.">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#FFFFFF; --surface:#F5F5F7; --surface-2:#FAFAFC; --card:#FFFFFF;
  --border:#D9D9DF; --border-soft:#EBEBF0;
  --ink:#1D1D1F; --ink-2:#5B5B63; --ink-3:#8A8A92;
  --navy:#0F2B4C;
  --accent:#007AFF; --accent-dark:#0062CC;
  --accent-soft:#EAF3FF; --accent-line:#B9D9FF;
  --ok:#1E7F38;   --ok-fill:#34C759; --ok-bg:#E9F9EE;  --ok-line:#A9E7B9;
  --warn:#A66300; --warn-fill:#FF9500; --warn-bg:#FFF5E8; --warn-line:#FFD8A3;
  --crit:#C42B21; --crit-fill:#FF3B30; --crit-bg:#FFEEEC; --crit-line:#FFC6C1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --radius:14px;
  --rail:250px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#161B22; --surface-2:#131820; --card:#161B22;
    --border:#2C333D; --border-soft:#222831;
    --ink:#E9EBEF; --ink-2:#A7AFBA; --ink-3:#79828E;
    --navy:#9FC5F0;
    --accent:#4DA3FF; --accent-dark:#7CBBFF;
    --accent-soft:rgba(77,163,255,.12); --accent-line:rgba(77,163,255,.35);
    --ok:#5DD67C;   --ok-fill:#34C759;  --ok-bg:rgba(52,199,89,.13);   --ok-line:rgba(93,214,124,.32);
    --warn:#FFB65C; --warn-fill:#FF9500; --warn-bg:rgba(255,149,0,.13); --warn-line:rgba(255,182,92,.32);
    --crit:#FF8178; --crit-fill:#FF3B30; --crit-bg:rgba(255,59,48,.13); --crit-line:rgba(255,129,120,.32);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --surface-2:#131820; --card:#161B22;
  --border:#2C333D; --border-soft:#222831;
  --ink:#E9EBEF; --ink-2:#A7AFBA; --ink-3:#79828E;
  --navy:#9FC5F0;
  --accent:#4DA3FF; --accent-dark:#7CBBFF;
  --accent-soft:rgba(77,163,255,.12); --accent-line:rgba(77,163,255,.35);
  --ok:#5DD67C;   --ok-fill:#34C759;  --ok-bg:rgba(52,199,89,.13);   --ok-line:rgba(93,214,124,.32);
  --warn:#FFB65C; --warn-fill:#FF9500; --warn-bg:rgba(255,149,0,.13); --warn-line:rgba(255,182,92,.32);
  --crit:#FF8178; --crit-fill:#FF3B30; --crit-bg:rgba(255,59,48,.13); --crit-line:rgba(255,129,120,.32);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.32);
}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,.cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ═══ SHELL ═══ */
.topbar{position:sticky;top:0;z-index:120;display:flex;align-items:center;gap:13px;
  padding:12px 26px;background:var(--bg);border-bottom:1px solid var(--border)}
.tb-brand{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:-.2px;color:var(--navy);white-space:nowrap}
.tb-brand em{font-style:normal;color:var(--accent)}
.tb-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-line);
  background:var(--accent-soft);padding:3px 9px;border-radius:100px;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:13px}
.tb-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-prog{width:92px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.tb-prog span{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start;
  max-width:1200px;margin:0 auto}

/* ═══ RAIL ═══ */
.rail{position:sticky;top:52px;max-height:calc(100vh - 52px);overflow-y:auto;
  padding:26px 16px 40px 26px;border-right:1px solid var(--border)}
.rail-h{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--ink-3);margin:16px 0 9px 9px}
.rail-h:first-child{margin-top:0}
.rail-list{list-style:none;display:flex;flex-direction:column;gap:1px}
.rail-list a{display:grid;grid-template-columns:24px 1fr 8px;gap:8px;align-items:center;
  padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink-2);
  font-size:13.5px;line-height:1.3;transition:background .15s,color .15s}
.rail-list a:hover{background:var(--surface);color:var(--ink)}
.rail-list a .rn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.rail-list a.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.rail-list a.on .rn{color:var(--accent-dark)}
.rdot{width:7px;height:7px;border-radius:50%;justify-self:end}
.rdot.s-strong{background:var(--ok-fill)}
.rdot.s-partial{background:var(--warn-fill)}
.rdot.s-thin{background:var(--crit-fill)}
.rdot.s-none{background:transparent}

/* ═══ PAGES ═══ */
.stage{padding:42px 44px 84px;min-width:0}
.page{display:none}
.page.on{display:flex;flex-direction:column;gap:26px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}.tb-prog span{transition:none}}

.opener{display:flex;flex-direction:column;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.op-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.op-num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--accent)}
.op-rule{flex:1;height:1px;background:var(--accent-line);min-width:16px}
.page h1{font-size:clamp(28px,4.4vw,43px);font-weight:700;letter-spacing:-1.1px;
  line-height:1.07;color:var(--ink)}
.thesis{font-size:17.5px;line-height:1.55;color:var(--ink-2);max-width:58ch}
.thesis strong{color:var(--ink);font-weight:600}

.keyfig{display:flex;align-items:baseline;gap:13px;padding:12px 0 2px;flex-wrap:wrap}
.keyfig .kv{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;line-height:1;
  letter-spacing:-2px;color:var(--navy);font-variant-numeric:tabular-nums}
.keyfig .kv.warn{color:var(--crit)}
.keyfig .kv.good{color:var(--ok)}
.keyfig .kl{font-size:13.5px;color:var(--ink-3);max-width:36ch;line-height:1.4}

h2{font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--ink);
  padding-bottom:8px;border-bottom:1px solid var(--border)}
h3{font-size:15.5px;font-weight:700;color:var(--ink)}
.lede{font-size:15.5px;color:var(--ink-2);max-width:68ch}
.lede strong{color:var(--ink);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;
  padding:2.5px 8px;border-radius:5px;white-space:nowrap;vertical-align:middle}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chip.ev{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.chip.der{color:var(--accent-dark);background:var(--accent-soft);border:1px solid var(--accent-line)}
.chip.inf{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.chip.est{color:var(--ink-3);background:var(--surface);border:1px solid var(--border)}
.chip.gap{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}

/* findings */
.findings{display:flex;flex-direction:column;gap:12px}
.finding{background:var(--card);border:1px solid var(--border-soft);
  border-left:3px solid var(--sev,var(--ink-3));border-radius:0 var(--radius) var(--radius) 0;
  padding:18px 21px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.finding.f-crit{--sev:var(--crit-fill)}
.finding.f-high{--sev:var(--warn-fill)}
.finding.f-med{--sev:var(--accent)}
.f-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.f-sev{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.9px;
  text-transform:uppercase;padding:2px 7px;border-radius:5px}
.f-crit .f-sev{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.f-high .f-sev{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.f-med .f-sev{color:var(--accent-dark);background:var(--accent-soft);border:1px solid var(--accent-line)}
.f-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17.5px;
  letter-spacing:-.2px;line-height:1.3;color:var(--ink);width:100%}
.finding p{font-size:14.5px;color:var(--ink-2)}
.finding p strong{color:var(--ink);font-weight:600}
.quote{border-left:2px solid var(--accent-line);padding:2px 0 2px 14px;margin:2px 0;
  font-size:14px;color:var(--ink-2);font-style:italic;max-width:64ch}
.quote cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.f-fix{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:9px;
  padding:11px 14px;font-size:14px;color:var(--ink-2)}
.f-fix b{font-family:'IBM Plex Sans Condensed',sans-serif;color:var(--accent-dark);font-size:12px;
  letter-spacing:1.1px;text-transform:uppercase;display:block;margin-bottom:3px}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
th{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;text-align:left;font-size:11.5px;
  letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);padding:11px 15px;
  border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
td{padding:11px 15px;border-bottom:1px solid var(--border-soft);color:var(--ink-2);vertical-align:top}
tr:last-child td{border-bottom:none}
td b,td strong{color:var(--ink);font-weight:600}
td.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);white-space:nowrap}
td.num,th.num{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
th.num{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:11.5px}
.dup{color:var(--crit);font-weight:600}
.keep{color:var(--ok);font-weight:600}

/* figure + bars */
.figure{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:21px}
.fig-cap{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:12px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:17px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:152px 1fr 54px;gap:12px;align-items:center}
.bar-l{font-size:13px;color:var(--ink-2)}
.bar-t{height:18px;background:var(--surface);border-radius:5px;overflow:hidden}
.bar-f{height:100%;border-radius:5px;background:var(--accent)}
.bar-f.red{background:var(--crit-fill)}
.bar-f.green{background:var(--ok-fill)}
.bar-f.grey{background:var(--ink-3);opacity:.4}
.bar-v{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums}
.fig-note{margin-top:14px;font-size:12.5px;color:var(--ink-3)}

/* pipes */
.flowbox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:21px;display:flex;flex-direction:column;gap:20px}
.flowrow{display:flex;flex-direction:column;gap:10px}
.flowlabel{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--ink-3)}
.flowlabel.after{color:var(--accent-dark)}
.flowlabel.plain{letter-spacing:.3px;text-transform:none;font-size:12.5px}
.pipes{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pipe{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pipe.cut{color:var(--crit);border-color:var(--crit-line);background:var(--crit-bg);
  text-decoration:line-through;text-decoration-thickness:1px}
.pipe.keep{color:var(--accent-dark);border-color:var(--accent-line);background:var(--accent-soft);font-weight:500}
.arrow{color:var(--ink-3);font-size:13px;flex:none}

/* stages */
.stages{display:flex;flex-direction:column;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:var(--card)}
.stage-row{display:grid;grid-template-columns:32px 1fr 126px;gap:14px;padding:12px 16px;
  border-bottom:1px solid var(--border-soft);align-items:baseline}
.stage-row:last-child{border-bottom:none}
.stage-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stage-name{font-size:14.5px;color:var(--ink)}
.stage-name span{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);margin-top:2px}
.stage-who{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);text-align:right}
.stage-row.bottleneck{background:var(--crit-bg)}
.stage-row.bottleneck .stage-who{color:var(--crit);font-weight:600}

/* asks */
.asks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ask{display:flex;gap:13px;padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--border-soft);font-size:14.5px;color:var(--ink-2)}
.ask:last-child{border-bottom:none}
.ask-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);flex:none;padding-top:2px}
.ask b{color:var(--ink);font-weight:600}

/* phases */
.phases{display:flex;flex-direction:column;gap:12px}
.phase{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 21px;display:flex;flex-direction:column;gap:9px}
.phase-top{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.phase-when{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--accent-dark);border:1px solid var(--accent-line);background:var(--accent-soft);padding:2px 8px;border-radius:5px}
.phase-t{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:16.5px;color:var(--ink);letter-spacing:-.2px}
.phase ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.phase li{font-size:14.5px;color:var(--ink-2);padding-left:17px;position:relative}
.phase li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}

/* notice */
.notice{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn-fill);
  border-radius:0 10px 10px 0;padding:16px 20px;display:flex;flex-direction:column;gap:7px}
.notice.blue{border-left-color:var(--accent)}
.notice.red{border-left-color:var(--crit-fill)}
.notice-h{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink)}
.notice p{font-size:14px;color:var(--ink-2);max-width:72ch}

/* rules */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rulecol{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px}
.rulecol h4{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:11px;font-weight:700}
.rulecol.do h4{color:var(--ok)}
.rulecol.dont h4{color:var(--crit)}
.rulecol ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.rulecol li{font-size:14px;color:var(--ink-2);padding-left:16px;position:relative;line-height:1.5}
.rulecol.do li::before{content:'+';position:absolute;left:0;color:var(--ok);font-weight:700}
.rulecol.dont li::before{content:'\2212';position:absolute;left:0;color:var(--crit);font-weight:700}

/* ═══ DATA STATUS — the completeness block on every function page ═══ */
.dstatus{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.ds-head{display:flex;align-items:center;gap:11px;padding:13px 18px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.ds-head h4{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.ds-level{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.9px;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.ds-level.strong{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.ds-level.partial{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.ds-level.thin{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.ds-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ds-col{padding:15px 18px}
.ds-col+.ds-col{border-left:1px solid var(--border-soft)}
.ds-col h5{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;font-weight:500}
.ds-col ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.ds-col li{font-size:13.5px;color:var(--ink-2);padding-left:17px;position:relative;line-height:1.45}
.ds-col.have li::before{content:'\2713';position:absolute;left:0;color:var(--ok);font-weight:700;font-size:12px}
.ds-col.need li::before{content:'\2013';position:absolute;left:1px;color:var(--crit);font-weight:700}
.ds-foot{padding:13px 18px;border-top:1px solid var(--border-soft);background:var(--surface-2);
  font-size:13.5px;color:var(--ink-2)}
.ds-foot b{color:var(--ink);font-weight:600}

/* ═══ INTEGRATION CHAIN ═══ */
.chain{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:var(--card)}
.link{display:grid;grid-template-columns:30px 1fr 104px;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--border-soft);align-items:start}
.link:last-child{border-bottom:none}
.link-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-top:2px}
.link-b b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15.5px;
  font-weight:700;color:var(--ink);letter-spacing:-.1px;margin-bottom:3px}
.link-b span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.link-b code{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);
  background:var(--surface);padding:1px 5px;border-radius:4px}
.link-v{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.8px;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;text-align:center}
.link-v.ok{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.link-v.gated{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.link-v.manual{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.link.is-manual{background:var(--crit-bg)}

/* ═══ HOW THIS GETS EASIER ═══ */
.easier{border:1px solid var(--accent-line);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.ez-head{padding:12px 18px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);
  font-family:'IBM Plex Sans Condensed',sans-serif;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--accent-dark);font-weight:700}
.ez-row{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border-soft)}
.ez-row:last-child{border-bottom:none}
.ez-k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.ez-row.after .ez-k{color:var(--ok)}
.ez-row.we .ez-k{color:var(--accent-dark)}
.ez-v{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.ez-v b{color:var(--ink);font-weight:600}
@media (max-width:640px){.ez-row{grid-template-columns:1fr;gap:4px}}

/* ═══ HEALTH SCORECARD ═══ */
.score{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.sc-row{display:grid;grid-template-columns:1fr 150px 118px;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border-soft);align-items:center}
.sc-row:last-child{border-bottom:none}
.sc-row.head{background:var(--surface);border-bottom:1px solid var(--border)}
.sc-row.head span{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sc-t{font-size:14.5px;color:var(--ink)}
.sc-t small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.sc-th{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sc-v{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:5px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px solid var(--border)}
td.hi{background:var(--accent-soft)}
@media (max-width:640px){.sc-row{grid-template-columns:1fr}.sc-v{justify-self:start}}

/* ═══ COMPLETENESS MATRIX ═══ */
.matrix{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.mx-row{display:grid;grid-template-columns:30px 1fr 92px 1fr;gap:14px;padding:13px 18px;
  border-bottom:1px solid var(--border-soft);align-items:center}
.mx-row:last-child{border-bottom:none}
.mx-row.head{background:var(--surface);border-bottom:1px solid var(--border)}
.mx-row.head span{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:11.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--ink-3);font-weight:700}
.mx-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mx-name{font-size:14.5px;color:var(--ink);font-weight:600}
.mx-gap{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.mx-lvl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.8px;
  text-transform:uppercase;padding:3px 8px;border-radius:5px;text-align:center}
.mx-lvl.strong{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}
.mx-lvl.partial{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.mx-lvl.thin{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}

/* ═══ COVER ═══ */
.page.on.cover{gap:0}
.cover-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:11px;margin-bottom:20px}
.cover-eyebrow::after{content:'';flex:1;height:1px;background:var(--accent-line)}
.cover h1{font-size:clamp(34px,6vw,58px);font-weight:700;letter-spacing:-1.9px;line-height:1.03;margin-bottom:22px}
.cover .thesis{font-size:18.5px;max-width:58ch;margin-bottom:32px}
.cover-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:28px}
.cstat{background:var(--card);padding:17px 18px}
.cstat .n{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;line-height:1;
  letter-spacing:-1.4px;color:var(--navy);font-variant-numeric:tabular-nums}
.cstat .n.warn{color:var(--crit)}
.cstat .n.good{color:var(--ok)}
.cstat .l{margin-top:7px;font-size:11.5px;line-height:1.35;color:var(--ink-3)}
.cover-meta{display:flex;gap:32px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--border)}
.cover-meta div{font-size:11.5px;color:var(--ink-3)}
.cover-meta b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);margin-top:3px}

/* ═══ CONTENTS ═══ */
.toc{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.toc-sec{padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3)}
.toc a{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;
  padding:14px 18px;text-decoration:none;border-bottom:1px solid var(--border-soft);transition:background .15s}
.toc a:last-child{border-bottom:none}
.toc a:hover{background:var(--surface)}
.toc .tn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.toc .tt{display:flex;flex-direction:column;gap:2px}
.toc .tt b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.toc .tt span{font-size:13px;color:var(--ink-3);line-height:1.4}

/* ═══ PAGER ═══ */
.pager{display:flex;gap:11px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.pgbtn{flex:1;min-width:190px;display:flex;flex-direction:column;gap:3px;padding:14px 17px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  text-decoration:none;transition:border-color .15s,background .15s;cursor:pointer;font-family:inherit;text-align:left}
.pgbtn:hover{border-color:var(--accent-line);background:var(--surface)}
.pgbtn small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3)}
.pgbtn b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.pgbtn.nx{text-align:right;align-items:flex-end}
.pgbtn[hidden]{display:none}

/* ═══ RESPONSIVE ═══ */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--border);
    padding:14px 20px;overflow-x:auto}
  .rail-list{flex-direction:row;gap:6px}
  .rail-list a{grid-template-columns:auto;white-space:nowrap;padding:6px 11px;font-size:12.5px}
  .rail-list a .rn,.rdot{display:none}
  .rail-h{display:none}
  .stage{padding:26px 20px 64px}
  .ds-body{grid-template-columns:1fr}
  .ds-col+.ds-col{border-left:none;border-top:1px solid var(--border-soft)}
}
@media (max-width:640px){
  .cover-stats{grid-template-columns:1fr 1fr}
  .rules{grid-template-columns:1fr}
  .stage-row{grid-template-columns:26px 1fr;gap:10px}
  .stage-who{grid-column:2;text-align:left;margin-top:-4px}
  .bar{grid-template-columns:104px 1fr 46px;gap:9px}
  .bar-l{font-size:12px}
  .toc a{grid-template-columns:30px 1fr;gap:11px}
  .mx-row{grid-template-columns:26px 1fr;gap:8px}
  .mx-lvl{grid-column:2;justify-self:start}
  .mx-gap{grid-column:2}
  .cover-meta{gap:18px}
}

async function checkGate(){var pw=document.getElementById('gate-pw').value.trim(),err=document.getElementById('gate-error'),busy=document.getElementById('gate-busy'),btn=document.getElementById('gate-btn');err.style.display='none';if(!window.crypto||!crypto.subtle){err.textContent='Open this report over https at nexvorasystems.us to sign in.';err.style.display='block';return;}busy.style.display='block';btn.disabled=true;try{var html=await decryptReport(pw);try{sessionStorage.setItem(GATE_KEY,pw);}catch(e){}revealReport(html);}catch(e){err.textContent='That password is not correct.';err.style.display='block';document.getElementById('gate-pw').style.borderColor='rgba(239,68,68,.6)';}finally{busy.style.display='none';btn.disabled=false;}}
document.getElementById('gate-btn').addEventListener('click',checkGate);
document.getElementById('gate-form').addEventListener('submit',function(e){e.preventDefault();checkGate();});
(function(){var i=document.getElementById('gate-pw');i.addEventListener('focus',function(){i.style.borderColor='rgba(13,148,136,.7)';});i.addEventListener('blur',function(){i.style.borderColor='rgba(255,255,255,.15)';});i.focus();})();
(async function(){var pw=null;try{pw=sessionStorage.getItem(GATE_KEY);}catch(e){}if(!pw||!window.crypto||!crypto.subtle)return;try{revealReport(await decryptReport(pw));}catch(e){try{sessionStorage.removeItem(GATE_KEY);}catch(e2){}}})();

<script>
function initReport() {
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var railBox = document.getElementById('rail');
  var toc = document.getElementById('toc');
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  var prevt = document.getElementById('prevt'), nextt = document.getElementById('nextt');
  var count = document.getElementById('pcount'), prog = document.getElementById('prog');
  var idx = 0, railLinks = [];

  function label(p) { return p.getAttribute('data-short') || p.getAttribute('data-title'); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function indexOfId(id) {
    for (var n = 0; n < pages.length; n++) if (pages[n].id === id) return n;
    return -1;
  }
  function bindJump(a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(i, true); });
  }

  // ── build the rail, grouped ──
  var lastGroup = null, ul = null;
  pages.forEach(function (p, i) {
    var g = p.getAttribute('data-group') || '';
    if (g !== lastGroup) {
      if (g) {
        var h = document.createElement('div');
        h.className = 'rail-h';
        h.textContent = g;
        railBox.appendChild(h);
      }
      ul = document.createElement('ul');
      ul.className = 'rail-list';
      railBox.appendChild(ul);
      lastGroup = g;
    }
    var st = p.getAttribute('data-status') || '';
    var dot = st ? 's-' + st : 's-none';
    var a = document.createElement('a');
    a.href = '#' + p.id;
    a.innerHTML = '<span class="rn">' + (p.getAttribute('data-num') || '&middot;') + '</span>' +
                  '<span>' + label(p) + '</span>' +
                  '<span class="rdot ' + dot + '"></span>';
    var li = document.createElement('li');
    li.appendChild(a);
    ul.appendChild(li);
    railLinks.push(a);
    bindJump(a, i);
  });

  // ── build contents, grouped ──
  var tocGroup = null;
  pages.forEach(function (p) {
    var num = p.getAttribute('data-num');
    var g = p.getAttribute('data-group') || '';
    if (!num && !g) return;
    if (g && g !== tocGroup) {
      var s = document.createElement('div');
      s.className = 'toc-sec';
      s.textContent = g;
      toc.appendChild(s);
      tocGroup = g;
    }
    var thesis = p.querySelector('.thesis');
    var txt = thesis ? thesis.textContent.trim() : '';
    if (txt.length > 120) txt = txt.slice(0, 117).replace(/\s+\S*$/, '') + '…';
    var a = document.createElement('a');
    a.href = '#' + p.id;
    a.innerHTML = '<span class="tn">' + (num || '&middot;') + '</span>' +
      '<span class="tt"><b>' + p.getAttribute('data-title') + '</b><span>' + txt + '</span></span>';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var i = indexOfId(this.getAttribute('href').slice(1));
      if (i > -1) show(i, true);
    });
    toc.appendChild(a);
  });

  function show(i, push) {
    if (i < 0 || i >= pages.length) return;
    idx = i;
    pages.forEach(function (p, n) { p.classList.toggle('on', n === i); });
    for (var k = 0; k < railLinks.length; k++) railLinks[k].classList.toggle('on', k === i);

    if (i > 0) { prev.hidden = false; prevt.textContent = label(pages[i - 1]); }
    else { prev.hidden = true; }
    if (i < pages.length - 1) { next.hidden = false; nextt.textContent = label(pages[i + 1]); }
    else { next.hidden = true; }

    count.textContent = pad(i + 1) + ' / ' + pad(pages.length);
    prog.style.width = ((i + 1) / pages.length * 100) + '%';

    if (push) {
      try {
        if (location.hash !== '#' + pages[i].id) history.replaceState(null, '', '#' + pages[i].id);
      } catch (e) { /* navigation still works without the hash */ }
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function byHash() {
    var i = indexOfId(location.hash.replace('#', ''));
    show(i > -1 ? i : 0, false);
  }

  prev.addEventListener('click', function () { show(idx - 1, true); });
  next.addEventListener('click', function () { show(idx + 1, true); });
  window.addEventListener('hashchange', byHash);
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') show(idx + 1, true);
    if (e.key === 'ArrowLeft') show(idx - 1, true);
  });

  byHash();
})();
}
</script>
</body>
