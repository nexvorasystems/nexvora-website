<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Free Business Assessment — Nexvora Systems</title>
<link rel="canonical" href="https://nexvorasystems.us/assessment.html"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#FAF8F5;--bg-surface:#F0EDE8;--bg-card:#FFFFFF;--text:#1A1A2E;--muted:#4A5568;--dim:#718096;--border:#E2DDD5;--teal:#0D9488;--teal-lt:rgba(13,148,136,0.1);--navy:#0F2B4C;--red:#EF4444;--nav-h:76px;}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);display:flex;align-items:center;background:rgba(250,248,245,0.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;gap:20px;}
.prog-wrap{flex:1;display:flex;align-items:center;gap:12px;max-width:400px;margin:0 auto;}
.prog-label{font-size:11px;color:var(--dim);white-space:nowrap;min-width:100px;}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .6s ease;width:0%;}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color .15s;}
.nav-back:hover{color:var(--teal);}
/* --app-h is set by JS to visualViewport.height — excludes iOS Safari browser chrome (correct) */
.chat-wrap{position:fixed;top:var(--nav-h);left:0;right:0;height:calc(var(--app-h,100vh) - var(--nav-h));display:flex;flex-direction:column;}
.chat-scroll{flex:1;overflow-y:auto;padding:32px 16px 20px;scroll-behavior:smooth;}
.chat-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.brow{display:flex;align-items:flex-end;gap:10px;}
.brow.bot{justify-content:flex-start;}
.brow.user{justify-content:flex-end;}
.avatar{width:34px;height:34px;min-width:34px;border-radius:50%;background:linear-gradient(135deg,#0F2B4C,#0D9488);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;}
.bbl{max-width:84%;padding:13px 17px;border-radius:18px;font-size:15px;line-height:1.65;}
.bbl.bot{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.bbl.user{background:var(--teal);color:#fff;border-bottom-right-radius:4px;}
.typing-dots{display:flex;gap:5px;align-items:center;padding:4px 2px;}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:td 1.4s ease-in-out infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-7px);opacity:1;}}
.chat-input-area{border-top:1px solid var(--border);background:var(--bg-card);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));flex-shrink:0;}
.input-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.chat-input{flex:1;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;}
.chat-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-lt);}
.chat-input.err{border-color:var(--red);}
.send-btn{width:44px;height:44px;min-width:44px;border-radius:11px;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;}
.send-btn:hover{filter:brightness(1.1);}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}
.err-msg{font-size:12px;color:var(--red);display:none;}
.err-msg.show{display:block;}
.chips{display:flex;flex-wrap:wrap;gap:9px;padding-top:4px;}
.chip{padding:10px 18px;border-radius:99px;border:1.5px solid var(--border);background:var(--bg-card);font-size:14px;color:var(--muted);font-weight:500;cursor:pointer;transition:all .15s;user-select:none;min-height:44px;display:inline-flex;align-items:center;touch-action:manipulation;}
.chip.on{border-color:var(--teal);background:var(--teal);color:#fff;}
@media(hover:hover){.chip:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-lt);}}
.multi-confirm{margin-top:8px;}
.multi-confirm button{padding:10px 22px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;}
.multi-confirm button:disabled{opacity:.35;cursor:not-allowed;}
.undo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--teal);background:var(--teal-lt);animation:fadeIn .15s ease;}
.undo-bar-label{font-size:14px;font-weight:600;color:var(--teal);}
.undo-bar-change{background:none;border:1.5px solid var(--teal);color:var(--teal);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.undo-bar-change:hover{background:var(--teal);color:#fff;}
.undo-bar-timer{width:100%;height:3px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden;}
.undo-bar-timer-fill{height:100%;background:var(--teal);border-radius:2px;animation:undoTimer 2s linear forwards;}
@keyframes undoTimer{from{width:100%}to{width:0%}}
.start-over-btn{position:absolute;top:8px;right:12px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:10px 14px;font-size:12px;font-family:inherit;cursor:pointer;opacity:.6;transition:all .15s;min-height:44px;display:inline-flex;align-items:center;}
.start-over-btn:hover{opacity:1;border-color:var(--text-muted);color:var(--text);}
.state-dropdown-wrap{position:relative;width:100%;}
.state-trigger{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;background:var(--bg);color:var(--text);font-family:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;-webkit-appearance:none;}
.state-trigger:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-lt);}
.state-trigger-arrow{font-size:10px;color:var(--text-muted);transition:transform .2s;}
.state-trigger-arrow.open{transform:rotate(180deg);}
.state-panel{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--bg-card);border:1.5px solid var(--teal);border-radius:14px;overflow:hidden;box-shadow:0 -8px 32px rgba(0,0,0,.18);z-index:100;display:none;flex-direction:column;}
.state-panel.open{display:flex;}
.state-search-input{padding:12px 14px;border:none;border-bottom:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;width:100%;box-sizing:border-box;-webkit-appearance:none;}
.state-list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.state-list-item{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;touch-action:manipulation;}
.state-list-item:last-child{border-bottom:none;}
@media(hover:hover){.state-list-item:hover{background:var(--teal-lt);}}
.state-abbr{font-size:12px;font-weight:800;color:var(--teal);min-width:26px;}
.state-name{font-size:14px;color:var(--text);}
.num-wrap{display:flex;align-items:center;gap:12px;}
.num-input{width:120px;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:18px;font-weight:700;color:var(--text);background:var(--bg);font-family:inherit;outline:none;text-align:center;-webkit-appearance:none;-moz-appearance:textfield;}
.num-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-lt);}
.num-unit{font-size:14px;color:var(--muted);}
.timer-badge{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;padding:4px 10px;border:1.5px solid var(--border);border-radius:99px;display:none;letter-spacing:.3px;}
.timer-badge.active{display:inline-block;}
.timer-badge.overtime{color:var(--red);border-color:var(--red);}
@keyframes nxSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@media(max-width:600px){nav{padding:0 16px;}.prog-label{display:none;}.bbl{font-size:14px;max-width:90%;}.chat-input-area{padding:12px 14px;}}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Free Business Health Assessment — Nexvora Systems</h1>
<nav>
  <a href="index.html"><img src="assets/logo-dark.png" alt="Nexvora Systems" style="height:44px;width:auto;display:block;"/></a>
  <div class="prog-wrap">
    <span class="prog-label" id="progLabel">Getting started</span>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <span class="timer-badge" id="timerBadge">⏱ 30:00</span>
  <a href="index.html" class="nav-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</nav>
<div class="chat-wrap">
  <div class="chat-scroll" id="chatScroll" style="position:relative;">
    <button class="start-over-btn" id="startOverBtn" style="display:none;" onclick="if(confirm('Start over from the beginning?')) location.reload();">↩ Start over</button>
    <div class="chat-inner" id="chatInner"></div>
  </div>
  <div class="chat-input-area" id="inputArea" style="display:none;">
    <div class="input-inner" id="inputInner"></div>
  </div>
</div>
<script>
/* ── GLOBALS ─────────────────────────────────────────── */
const A = {}; // all answers
const TOTAL_STEPS = 23; // 4 contact + 19 questions
let currentStep = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── LEAD TRACKING ───────────────────────────────────── */
let ghlContactId = null;
let assessmentComplete = false;
let opportunityTimer = null;
const TIMER_MS = 30 * 60 * 1000; // 30 minutes

/* ── COUNTDOWN TIMER DISPLAY ─────────────────────────── */
let timerInterval = null;
function startCountdownTimer() {
  const badge = document.getElementById('timerBadge');
  if (!badge) return;
  badge.classList.add('active');
  const endTime = Date.now() + TIMER_MS;
  timerInterval = setInterval(() => {
    const diff = endTime - Date.now();
    const neg = diff < 0;
    const abs = Math.abs(diff);
    const totalSec = Math.floor(abs / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    const fmt = (neg ? '-' : '') + min + ':' + String(sec).padStart(2, '0');
    badge.textContent = '⏱ ' + fmt;
    badge.classList.toggle('overtime', neg);
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (opportunityTimer) { clearTimeout(opportunityTimer); opportunityTimer = null; }
  const badge = document.getElementById('timerBadge');
  if (badge) badge.classList.remove('active');
}

/* ── FIRE OPPORTUNITY ON PAGE CLOSE ─────────────────── */
// sendBeacon fires even as the page is closing — most reliable method
let beaconSent = false;
function fireCloseBeacon() {
  if (beaconSent || assessmentComplete || !A.contact?.email) return;
  beaconSent = true;
  const payload = JSON.stringify({
    contactId: ghlContactId || null,
    name: A.contact.name || '',
    email: A.contact.email
  });
  navigator.sendBeacon('/api/create-opportunity', new Blob([payload], { type: 'application/json' }));
}

function registerCloseHandlers() {
  // pagehide: fires only on actual page unload (close/navigate), NOT on tab switch
  window.addEventListener('pagehide', fireCloseBeacon);
  // beforeunload: fires on navigate away / tab close (desktop fallback)
  window.addEventListener('beforeunload', fireCloseBeacon);
}

/* ── 30-MIN FALLBACK (tab left open) ────────────────── */
function scheduleOpportunity() {
  opportunityTimer = setTimeout(() => {
    if (assessmentComplete || beaconSent) return;
    // Use sendBeacon for the timeout too — more reliable than fetch
    const payload = JSON.stringify({
      contactId: ghlContactId || null,
      name: A.contact?.name || '',
      email: A.contact?.email
    });
    navigator.sendBeacon('/api/create-opportunity', new Blob([payload], { type: 'application/json' }));
    beaconSent = true;
  }, TIMER_MS);
}

/* ── PROGRESS ────────────────────────────────────────── */
function setProgress(step, label) {
  currentStep = step;
  const pct = Math.min((step / TOTAL_STEPS) * 100, 99);
  document.getElementById('progFill').style.width = pct + '%';
  if (label) document.getElementById('progLabel').textContent = label;
}

/* ── SCROLL ──────────────────────────────────────────── */
function scrollBottom() {
  const el = document.getElementById('chatScroll');
  el.scrollTop = el.scrollHeight;
}
function scrollToLast() {
  const el = document.getElementById('chatScroll');
  const bots = el.querySelectorAll('.brow.bot');
  if (bots.length) el.scrollTo({ top: Math.max(0, bots[bots.length-1].offsetTop - 28), behavior: 'smooth' });
}

/* ── BUBBLE ──────────────────────────────────────────── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function addBubble(text, type, isHtml=false) {
  const inner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = `brow ${type}`;
  const content = isHtml ? text : esc(text);
  if (type === 'bot') row.innerHTML = `<div class="avatar"><img src="/assets/murat.jpg" alt="Murat" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'MZ'}))"/></div><div class="bbl bot">${content}</div>`;
  else row.innerHTML = `<div class="bbl user">${content}</div>`;
  inner.appendChild(row);
  if (type === 'user') {
    const btn = document.getElementById('startOverBtn');
    if (btn) btn.style.display = '';
  }
  scrollBottom();
  return row;
}

/* ── TYPING ──────────────────────────────────────────── */
let typingEl = null;
function showTyping() {
  if (typingEl) return;
  const inner = document.getElementById('chatInner');
  typingEl = document.createElement('div');
  typingEl.className = 'brow bot';
  typingEl.innerHTML = `<div class="avatar"><img src="/assets/murat.jpg" alt="Murat" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'MZ'}))"/></div><div class="bbl bot"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  inner.appendChild(typingEl);
  scrollBottom();
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

async function speak(text, delay=800, isHtml=false) {
  showTyping();
  await sleep(delay);
  hideTyping();
  addBubble(text, 'bot', isHtml);
}

/* ── INPUT CLEAR ─────────────────────────────────────── */
function clearInput() {
  document.getElementById('inputInner').innerHTML = '';
  document.getElementById('inputArea').style.display = 'none';
}

/* ── TEXT INPUT ──────────────────────────────────────── */
function askText(placeholder, validate, type='text') {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    inner.innerHTML = `
      <div class="input-row">
        <input class="chat-input" id="ci" type="${type}" placeholder="${placeholder}" autocomplete="off"/>
        <button class="send-btn" id="csend" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="err-msg" id="cerr"></div>`;
    area.style.display = '';
    const inp = document.getElementById('ci');
    const btn = document.getElementById('csend');
    const err = document.getElementById('cerr');
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); inp.classList.remove('err'); err.classList.remove('show'); });
    const submit = () => {
      const val = inp.value.trim();
      if (!val) return;
      if (validate) { const e = validate(val); if (e) { inp.classList.add('err'); err.textContent = e; err.classList.add('show'); return; } }
      clearInput(); resolve(val);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    btn.addEventListener('click', submit);
    setTimeout(() => { inp.focus(); scrollToLast(); }, 80);
  });
}

/* ── NUMBER INPUT ────────────────────────────────────── */
function askNumber(unit, min, max) {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    inner.innerHTML = `
      <div class="input-row">
        <div class="num-wrap">
          <input class="num-input" id="ni" type="number" min="${min}" max="${max}" placeholder="0"/>
          <span class="num-unit">${unit}</span>
        </div>
        <button class="send-btn" id="nsend" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="err-msg" id="nerr"></div>`;
    area.style.display = '';
    const inp = document.getElementById('ni');
    const btn = document.getElementById('nsend');
    const err = document.getElementById('nerr');
    inp.addEventListener('input', () => { btn.disabled = inp.value === '' || isNaN(Number(inp.value)); inp.classList.remove('err'); err.classList.remove('show'); });
    const submit = () => {
      const val = Number(inp.value);
      if (isNaN(val)) return;
      if (val < min || val > max) { inp.classList.add('err'); err.textContent = `Please enter a value between ${min} and ${max}`; err.classList.add('show'); return; }
      clearInput(); resolve(val);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    btn.addEventListener('click', submit);
    setTimeout(() => { inp.focus(); scrollToLast(); }, 80);
  });
}

/* ── SINGLE CHIP ─────────────────────────────────────── */
function askChips(options) {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');

    function buildChips() {
      const wrap = document.createElement('div');
      wrap.className = 'chips';
      options.forEach(o => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = o.label;
        chip.addEventListener('mousedown', e => e.preventDefault());
        chip.onclick = () => {
          inner.innerHTML = '';
          const bar = document.createElement('div');
          bar.innerHTML = `
            <div class="undo-bar">
              <span class="undo-bar-label">${o.label} ✓</span>
              <button class="undo-bar-change">↩ change</button>
            </div>
            <div class="undo-bar-timer"><div class="undo-bar-timer-fill"></div></div>`;
          inner.appendChild(bar);
          const timer = setTimeout(() => { clearInput(); resolve(o.value); }, 2000);
          bar.querySelector('.undo-bar-change').addEventListener('mousedown', e => {
            e.preventDefault(); clearTimeout(timer); buildChips();
          });
        };
        wrap.appendChild(chip);
      });
      inner.innerHTML = '';
      inner.appendChild(wrap);
      area.style.display = '';
      setTimeout(() => scrollToLast(), 80);
    }

    buildChips();
  });
}

/* ── MULTI CHIP ──────────────────────────────────────── */
function askMultiChips(options, minSelect=1, exclusiveValues=[]) {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    const selected = new Set();
    const chipEls = {};
    options.forEach(o => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = o.label;
      chipEls[o.value] = chip;
      chip.onclick = () => {
        if (selected.has(o.value)) {
          selected.delete(o.value); chip.classList.remove('on');
        } else {
          // If clicking an exclusive value, deselect everything else
          if (exclusiveValues.includes(o.value)) {
            selected.forEach(v => { selected.delete(v); if(chipEls[v]) chipEls[v].classList.remove('on'); });
          } else {
            // If clicking a regular value, deselect any exclusive values
            exclusiveValues.forEach(ev => { if(selected.has(ev)) { selected.delete(ev); if(chipEls[ev]) chipEls[ev].classList.remove('on'); } });
          }
          selected.add(o.value); chip.classList.add('on');
        }
        confirmBtn.disabled = selected.size < minSelect;
      };
      wrap.appendChild(chip);
    });
    const confirmDiv = document.createElement('div');
    confirmDiv.className = 'multi-confirm';
    const confirmBtn = document.createElement('button');
    confirmBtn.textContent = 'Confirm →';
    confirmBtn.disabled = true;
    confirmBtn.onclick = () => { clearInput(); resolve([...selected]); };
    confirmDiv.appendChild(confirmBtn);
    inner.innerHTML = '';
    inner.appendChild(wrap);
    inner.appendChild(confirmDiv);
    area.style.display = '';
    setTimeout(() => scrollToLast(), 80);
  });
}

/* ── STATE SEARCH PICKER ─────────────────────────────── */
const ALL_STATES = [
  {abbr:'AL',name:'Alabama'},{abbr:'AK',name:'Alaska'},{abbr:'AZ',name:'Arizona'},{abbr:'AR',name:'Arkansas'},{abbr:'CA',name:'California'},{abbr:'CO',name:'Colorado'},{abbr:'CT',name:'Connecticut'},{abbr:'DE',name:'Delaware'},{abbr:'FL',name:'Florida'},{abbr:'GA',name:'Georgia'},{abbr:'HI',name:'Hawaii'},{abbr:'ID',name:'Idaho'},{abbr:'IL',name:'Illinois'},{abbr:'IN',name:'Indiana'},{abbr:'IA',name:'Iowa'},{abbr:'KS',name:'Kansas'},{abbr:'KY',name:'Kentucky'},{abbr:'LA',name:'Louisiana'},{abbr:'ME',name:'Maine'},{abbr:'MD',name:'Maryland'},{abbr:'MA',name:'Massachusetts'},{abbr:'MI',name:'Michigan'},{abbr:'MN',name:'Minnesota'},{abbr:'MS',name:'Mississippi'},{abbr:'MO',name:'Missouri'},{abbr:'MT',name:'Montana'},{abbr:'NE',name:'Nebraska'},{abbr:'NV',name:'Nevada'},{abbr:'NH',name:'New Hampshire'},{abbr:'NJ',name:'New Jersey'},{abbr:'NM',name:'New Mexico'},{abbr:'NY',name:'New York'},{abbr:'NC',name:'North Carolina'},{abbr:'ND',name:'North Dakota'},{abbr:'OH',name:'Ohio'},{abbr:'OK',name:'Oklahoma'},{abbr:'OR',name:'Oregon'},{abbr:'PA',name:'Pennsylvania'},{abbr:'RI',name:'Rhode Island'},{abbr:'SC',name:'South Carolina'},{abbr:'SD',name:'South Dakota'},{abbr:'TN',name:'Tennessee'},{abbr:'TX',name:'Texas'},{abbr:'UT',name:'Utah'},{abbr:'VT',name:'Vermont'},{abbr:'VA',name:'Virginia'},{abbr:'WA',name:'Washington'},{abbr:'WV',name:'West Virginia'},{abbr:'WI',name:'Wisconsin'},{abbr:'WY',name:'Wyoming'}
];

function askState() {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    inner.innerHTML = `
      <div class="state-dropdown-wrap" id="stateWrap">
        <button class="state-trigger" id="stateTrigger" type="button">
          <span id="stateTriggerLabel">Select your state</span>
          <span class="state-trigger-arrow" id="stateArrow">▼</span>
        </button>
        <div class="state-panel" id="statePanel">
          <input class="state-search-input" id="stateSearch" type="text" placeholder="Search state..." autocomplete="off"/>
          <div class="state-list" id="stateList"></div>
        </div>
      </div>`;
    area.style.display = '';

    const triggerEl = document.getElementById('stateTrigger');
    const panelEl   = document.getElementById('statePanel');
    const arrowEl   = document.getElementById('stateArrow');
    const searchEl  = document.getElementById('stateSearch');
    const listEl    = document.getElementById('stateList');

    function renderList(filter) {
      const q = (filter||'').toLowerCase().trim();
      const filtered = q
        ? ALL_STATES.filter(s => s.name.toLowerCase().includes(q) || s.abbr.toLowerCase().startsWith(q))
        : ALL_STATES;
      listEl.innerHTML = '';
      filtered.forEach(s => {
        const item = document.createElement('div');
        item.className = 'state-list-item';
        item.innerHTML = `<span class="state-abbr">${s.abbr}</span><span class="state-name">${s.name}</span>`;
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          closePanel();
          // Show undo bar briefly before resolving
          inner.innerHTML = '';
          const bar = document.createElement('div');
          bar.innerHTML = `
            <div class="undo-bar">
              <span class="undo-bar-label">${s.name} ✓</span>
              <button class="undo-bar-change">↩ change</button>
            </div>
            <div class="undo-bar-timer"><div class="undo-bar-timer-fill"></div></div>`;
          inner.appendChild(bar);
          const timer = setTimeout(() => { clearInput(); resolve(s.abbr); }, 2000);
          bar.querySelector('.undo-bar-change').addEventListener('mousedown', ev => {
            ev.preventDefault(); clearTimeout(timer);
            // Re-build the dropdown
            inner.innerHTML = `
              <div class="state-dropdown-wrap" id="stateWrap">
                <button class="state-trigger" id="stateTrigger" type="button">
                  <span id="stateTriggerLabel">Select your state</span>
                  <span class="state-trigger-arrow" id="stateArrow">▼</span>
                </button>
                <div class="state-panel open" id="statePanel">
                  <input class="state-search-input" id="stateSearch" type="text" placeholder="Search state..." autocomplete="off"/>
                  <div class="state-list" id="stateList"></div>
                </div>
              </div>`;
            arrowEl.classList.add('open');
            // Re-wire events on new DOM
            const newTrigger = document.getElementById('stateTrigger');
            const newPanel   = document.getElementById('statePanel');
            const newArrow   = document.getElementById('stateArrow');
            const newSearch  = document.getElementById('stateSearch');
            const newList    = document.getElementById('stateList');
            function renderNew(filter) {
              const q = (filter||'').toLowerCase().trim();
              const filtered = q ? ALL_STATES.filter(st => st.name.toLowerCase().includes(q) || st.abbr.toLowerCase().startsWith(q)) : ALL_STATES;
              newList.innerHTML = '';
              filtered.forEach(st => {
                const it = document.createElement('div');
                it.className = 'state-list-item';
                it.innerHTML = `<span class="state-abbr">${st.abbr}</span><span class="state-name">${st.name}</span>`;
                it.addEventListener('mousedown', ev2 => {
                  ev2.preventDefault();
                  inner.innerHTML = '';
                  const bar2 = document.createElement('div');
                  bar2.innerHTML = `
                    <div class="undo-bar"><span class="undo-bar-label">${st.name} ✓</span><button class="undo-bar-change">↩ change</button></div>
                    <div class="undo-bar-timer"><div class="undo-bar-timer-fill"></div></div>`;
                  inner.appendChild(bar2);
                  const t2 = setTimeout(() => { clearInput(); resolve(st.abbr); }, 2000);
                  bar2.querySelector('.undo-bar-change').addEventListener('mousedown', ev3 => {
                    ev3.preventDefault(); clearTimeout(t2); newSearch.value = ''; renderNew(''); newPanel.classList.add('open'); newArrow.classList.add('open'); inner.innerHTML = ''; inner.appendChild(newTrigger.closest('.state-dropdown-wrap') || document.getElementById('stateWrap'));
                  });
                });
                newList.appendChild(it);
              });
            }
            renderNew('');
            newSearch.addEventListener('input', () => renderNew(newSearch.value));
            newTrigger.addEventListener('click', () => newPanel.classList.contains('open') ? (newPanel.classList.remove('open'), newArrow.classList.remove('open')) : (newPanel.classList.add('open'), newArrow.classList.add('open')));
            setTimeout(() => newSearch.focus(), 50);
          });
        });
        listEl.appendChild(item);
      });
    }

    function openPanel() {
      panelEl.classList.add('open');
      arrowEl.classList.add('open');
      searchEl.value = '';
      renderList('');
      setTimeout(() => { searchEl.focus(); }, 50);
    }

    function closePanel() {
      panelEl.classList.remove('open');
      arrowEl.classList.remove('open');
    }

    triggerEl.addEventListener('click', () => {
      panelEl.classList.contains('open') ? closePanel() : openPanel();
    });

    searchEl.addEventListener('input', () => renderList(searchEl.value));

    setTimeout(() => { scrollToLast(); }, 80);
  });
}

/* ── SUBTYPE SEARCH PICKER ───────────────────────────── */
function askSubtypeSearch(options) {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    inner.innerHTML = `
      <div class="state-search-wrap">
        <input class="state-search-input" id="subtypeSearch" type="text" placeholder="Search your business type..." autocomplete="off"/>
        <div class="state-list" id="subtypeList"></div>
      </div>`;
    area.style.display = '';

    const searchEl = document.getElementById('subtypeSearch');
    const listEl = document.getElementById('subtypeList');

    function renderList(filter) {
      const q = (filter||'').toLowerCase().trim();
      const filtered = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;
      listEl.innerHTML = '';
      filtered.forEach(o => {
        const item = document.createElement('div');
        item.className = 'state-list-item';
        item.innerHTML = `<span class="state-name">${o.label}</span>`;
        item.onclick = () => { clearInput(); resolve({label: o.label, value: o.value}); };
        listEl.appendChild(item);
      });
      if (filtered.length === 0 && q.length >= 2) {
        const item = document.createElement('div');
        item.className = 'state-list-item';
        item.innerHTML = `<span class="state-name">Other: "${filter}"</span>`;
        item.onclick = () => {
          const v = filter.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
          clearInput(); resolve({label: filter, value: v});
        };
        listEl.appendChild(item);
      }
    }

    renderList();
    searchEl.addEventListener('input', () => renderList(searchEl.value));
    setTimeout(() => { searchEl.focus(); scrollToLast(); }, 80);
  });
}

/* ── OPTIONAL TEXT INPUT (with Skip button) ──────────── */
function askTextOptional(placeholder) {
  return new Promise(resolve => {
    const area = document.getElementById('inputArea');
    const inner = document.getElementById('inputInner');
    inner.innerHTML = `
      <div class="input-row">
        <input class="chat-input" id="ci" type="text" placeholder="${placeholder}" autocomplete="off"/>
        <button class="send-btn" id="csend" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div style="padding-top:6px;">
        <button id="cskip" style="background:none;border:none;font-size:13px;color:var(--dim);cursor:pointer;text-decoration:underline;padding:4px 0;font-family:inherit;">Skip this question</button>
      </div>`;
    area.style.display = '';
    const inp = document.getElementById('ci');
    const btn = document.getElementById('csend');
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
    const submit = val => { clearInput(); resolve(val); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) submit(inp.value.trim()); });
    btn.addEventListener('click', () => { if (inp.value.trim()) submit(inp.value.trim()); });
    document.getElementById('cskip').addEventListener('click', () => submit(''));
    setTimeout(() => { inp.focus(); scrollToLast(); }, 80);
  });
}

/* ── MAIN FLOW ───────────────────────────────────────── */
async function main() {
  setProgress(0, 'Getting started');
  await sleep(400);
  await speak(`<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;"><img src="/assets/murat.jpg" alt="Murat" style="width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'"/><div><div style="font-weight:800;font-size:15px;color:var(--text);">Murat Zhandaurov</div><div style="font-size:12px;color:var(--dim);">Co-Founder, Nexvora Systems</div></div></div>Hey — I'm Murat. My partner Alexandr and I built this assessment after working with dozens of business owners who were all dealing with the same invisible problems.<br><br>Your answers come directly to us. We read every one personally. This takes about 10 minutes.`, 1200, true);
  await sleep(300);
  await speak("Let's start with a few quick contact details so we can send you the report.", 700);

  /* ── CONTACT INFO ── */
  await sleep(300);
  await speak("What's your full name?", 600);
  setProgress(1, 'Contact info');
  const name = await askText("Your full name", v => v.trim().length >= 2 ? null : "Please enter your full name");
  addBubble(name, 'user');
  A.contact = { name };
  const first = name.split(' ')[0];

  setProgress(2);
  await speak(`Great to meet you, ${first}! What email should we send your report to?`, 700);
  const email = await askText("your@email.com", v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? null : "Please enter a valid email", 'email');
  addBubble(email, 'user');
  A.contact.email = email;

  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  A.contact.timezone = timezone;

  fetch('/api/capture-lead', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: A.contact.name, email, timezone })
  }).then(r => r.json()).then(d => {
    if (!d.contactId) { console.warn('[capture-lead] no contactId in response', d); return; }
    ghlContactId = d.contactId;
    const patch = {};
    if (A.contact.phone) patch.phone = A.contact.phone;
    if (A.contact.company) patch.company = A.contact.company;
    if (Object.keys(patch).length) {
      fetch('/api/update-lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: A.contact.email, ...patch }) }).catch(() => {});
    }
  }).catch(e => console.warn('[capture-lead] error:', e));

  registerCloseHandlers();
  startCountdownTimer();
  scheduleOpportunity();

  setProgress(3);
  await speak("Your phone number?", 600);
  const phone = await askText("+1 (555) 000-0000", v => v.replace(/\D/g,'').length >= 7 ? null : "Please enter a valid phone number", 'tel');
  addBubble(phone, 'user');
  A.contact.phone = phone;
  if (ghlContactId) {
    fetch('/api/update-lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: A.contact.email, phone }) }).catch(() => {});
  }

  setProgress(4);
  await speak("And your company name?", 600);
  const company = await askTextOptional("Company name (optional)");
  addBubble(company ? company : '(skipped)', 'user');
  A.contact.company = company;
  A.company_confirmed = false;
  if (company) {
    await speak("What state is your business in?", 500);
    A.q2 = await askState();
    addBubble((ALL_STATES.find(s=>s.abbr===A.q2)||{name:A.q2}).name, 'user');
    await speak("And which city?", 400);
    const bizCity = await askText("City", v => v.trim().length >= 2 ? null : "Please enter your city");
    addBubble(bizCity, 'user');
    A.q2_city = bizCity;
    const mapQ = encodeURIComponent(company + ' ' + bizCity + ' ' + A.q2);
    const safeCompany = company.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const safeCity = bizCity.replace(/</g,'&lt;');
    const stateName = (ALL_STATES.find(s=>s.abbr===A.q2)||{name:A.q2}).name;
    const mapH = window.innerWidth <= 480 ? 140 : 200;
    await speak(`Here's what we found for <strong>${safeCompany}</strong> in ${safeCity}, ${stateName} — does this look like your business?<br><br><iframe src="https://maps.google.com/maps?q=${mapQ}&output=embed&iwloc=near" width="100%" height="${mapH}" style="border:0;border-radius:8px;display:block;max-height:35vh;" loading="lazy" allowfullscreen></iframe>`, 1000, true);
    const confirmChoice = await askChips([{label:"Yes, that's my business", value:'yes'},{label:"Not finding it / skip", value:'no'}]);
    addBubble(confirmChoice === 'yes' ? "Yes, that's my business" : "Not finding it / skip", 'user');
    if (confirmChoice === 'yes') { A.company_confirmed = true; }
    else { await speak("No problem — we'll skip the online lookup. You can share more details on your strategy call.", 600); }
  }
  if (ghlContactId && A.contact.company) {
    fetch('/api/update-lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: A.contact.email, company: A.contact.company }) }).catch(() => {});
  }

  /* ── BUSINESS PARTNERS ── */
  setProgress(5, 'Your setup');
  await speak("Do you run this business alone, or do you have business partners?", 700);
  const _hasPartner = await askChips([
    {label:'Just me — I run it solo', value:'solo'},
    {label:'I have business partner(s)', value:'yes'},
  ]);
  addBubble(_hasPartner === 'yes' ? 'I have business partner(s)' : 'Just me — solo', 'user');
  A.partner = { has: _hasPartner === 'yes' };

  if (_hasPartner === 'yes') {
    await speak("How many business partners do you have? (not counting yourself)", 600);
    const _partnerCountRaw = await askNumber('', 1, 10);
    const _partnerCount = Math.max(1, Math.min(10, parseInt(_partnerCountRaw)||1));
    addBubble(_partnerCount + (_partnerCount === 1 ? ' partner' : ' partners'), 'user');
    A.partner.count = _partnerCount;

    await speak("First, what is YOUR primary role in the business?", 600);
    A.partner.userRole = await askTextOptional("e.g. CEO, Operations, Finance, Sales");
    addBubble(A.partner.userRole || '(skipped)', 'user');

    await speak("Do you have a formal operating agreement between all partners?", 500);
    A.partner.opAgreement = await askChips([
      {label:'Yes — we have one', value:'yes'},
      {label:'No — we don\'t', value:'no'},
    ]);
    addBubble(A.partner.opAgreement === 'yes' ? 'Yes, we have one' : 'No, we don\'t', 'user');

    // Collect info for each partner
    A.partners = [];
    for (let _pi = 1; _pi <= _partnerCount; _pi++) {
      const _pLabel = _partnerCount === 1 ? 'your partner' : `Partner ${_pi}`;
      await speak(`Now let's talk about ${_pLabel}. What's their name?`, 700);
      const _pName = await askTextOptional(`Partner ${_pi} name`);
      addBubble(_pName || `Partner ${_pi}`, 'user');

      await speak(`What's ${_pName||_pLabel}'s email? We'll send them the report too. (optional — skip if you prefer)`, 500);
      const _pEmail = await askTextOptional(`${_pName||'Partner'} email — or skip`);
      addBubble(_pEmail || '(skipped)', 'user');

      await speak(`What does ${_pName||_pLabel} mainly handle in the business?`, 600);
      const _pRole = await askTextOptional("e.g. Sales, Marketing, Operations, Finance");
      addBubble(_pRole || '(skipped)', 'user');

      await speak(`How involved is ${_pName||_pLabel} in day-to-day operations?`, 500);
      const _pInvolvement = await askChips([
        {label:'Hands-on daily', value:'both'},
        {label:'Handles a specific area', value:'specific'},
        {label:'Mostly strategic / part-time', value:'strategic'},
        {label:'Silent partner / investor', value:'silent'},
      ]);
      const _pInvL = {'both':'Hands-on daily','specific':'Specific area','strategic':'Strategic / part-time','silent':'Silent partner'};
      addBubble(_pInvL[_pInvolvement]||_pInvolvement, 'user');

      // Partner pay
      await speak(`How does ${_pName||_pLabel} take money from the business? Select all that apply.`, 700);
      const _ppTypesSel = await askMultiChips([
        {label:'W2 salary — regular paycheck',               value:'w2'},
        {label:'Distributions or owner draws',               value:'distribution'},
        {label:'Personal expenses through the business',     value:'expenses'},
        {label:'Other — I\'ll name it',                     value:'other'},
        {label:'They don\'t take any pay yet',               value:'none'},
      ], 1);

      const _ppPAY_DISPLAY = {w2:'W2 salary',distribution:'Distributions / draws',expenses:'Personal expenses via business'};
      const _ppPAY_SPEAK   = {w2:'W2 salary',distribution:'distributions or draws',expenses:'personal expenses via business'};
      const _ppEntries = _ppTypesSel.filter(v=>v!=='other'&&v!=='none').map(v=>({ key:v, label:_ppPAY_DISPLAY[v]||v, speak:_ppPAY_SPEAK[v]||v }));
      addBubble(_ppTypesSel.filter(v=>v!=='other'&&v!=='none').map(v=>_ppPAY_DISPLAY[v]||v).join(', ')||(_ppTypesSel.includes('none')?'No pay yet':'(selecting…)'),'user');

      if (_ppTypesSel.includes('other')) {
        await speak("What other ways? Separate with commas.", 500);
        const _ppOtherRaw = await askTextOptional("e.g. Consulting fee, Bonus");
        if (_ppOtherRaw) {
          _ppOtherRaw.split(',').map(n=>n.trim()).filter(Boolean).forEach((n,i)=>{
            const _k='other_'+n.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30)+(i>0?'_'+i:'');
            _ppEntries.push({key:_k,label:n,speak:n});
          });
          addBubble(_ppOtherRaw,'user');
        }
      }

      const _partnerPayObj = {};
      let _partnerPayTotal = 0;
      if (!_ppTypesSel.includes('none')) {
        for (const _ppe of _ppEntries) {
          await speak(`For ${_pName||_pLabel}'s ${_ppe.speak} — monthly, weekly, or yearly?`, 500);
          const _ppFreq = await askChips([{label:'Monthly',value:'monthly'},{label:'Weekly',value:'weekly'},{label:'Yearly',value:'yearly'}]);
          addBubble(_ppFreq==='monthly'?'Monthly':_ppFreq==='weekly'?'Weekly':'Yearly','user');
          await speak(`How much per ${_ppFreq==='yearly'?'year':_ppFreq}?`, 400);
          const _ppAmt = await askNumber('$', 0, 9999999);
          addBubble('$'+Number(_ppAmt).toLocaleString(),'user');
          const _ppMonthly = _ppFreq==='weekly'?Math.round(Number(_ppAmt)*4.33):_ppFreq==='yearly'?Math.round(Number(_ppAmt)/12):Number(_ppAmt);
          _partnerPayObj[_ppe.key] = {label:_ppe.label, amount:Number(_ppAmt), frequency:_ppFreq, monthly:_ppMonthly};
          _partnerPayTotal += _ppMonthly;
        }
        if (_partnerPayTotal > 0) {
          await speak(`Got it — ${_pName||_pLabel} takes about $${(_partnerPayTotal*12/1000).toFixed(0)}K/year from the business.`, 700);
        }
      }

      A.partners.push({
        name: _pName || `Partner ${_pi}`,
        email: _pEmail || null,
        role: _pRole || '',
        involvement: _pInvolvement,
        pay: _partnerPayObj,
        pay_total: _partnerPayTotal,
      });
    }

    // Backward compat: keep A.partner.partnerRole from first partner
    if (A.partners.length > 0) {
      A.partner.partnerRole = A.partners[0].role;
      A.partner.involvement = A.partners[0].involvement;
    }

    // Legacy single-partner fields (for backward compat with generate-report.js)
    A.partner_pay = A.partners[0]?.pay || {};
    A.partner_pay_total = A.partners[0]?.pay_total || 0;

    await speak("Great — understanding how all partners are compensated gives us a much clearer financial picture.", 700);
  }

  /* ── OWNER PAY (asked here alongside partner pay) ── */
  await speak(`Now let's do the same for you. How do you take money from your business? Select all that apply.`, 800);
  const _payTypesSel = await askMultiChips([
    {label:'W2 salary — regular paycheck',                  value:'w2'},
    {label:'Distributions or owner draws (withdrawals)',    value:'distribution'},
    {label:'I pay personal expenses through the business',  value:'expenses'},
    {label:'Other — I\'ll name it',                        value:'other'},

  const _PAY_DISPLAY = {w2:'W2 salary',distribution:'Distributions / draws',expenses:'Personal expenses via business'};
  const _PAY_SPEAK   = {w2:'your W2 salary',distribution:'your distributions or owner draws',expenses:'personal expenses you run through the business'};
  const _payEntries  = _payTypesSel.filter(v=>v!=='other').map(v=>({ key:v, label:_PAY_DISPLAY[v]||v, speak:_PAY_SPEAK[v]||v }));
  addBubble(_payTypesSel.filter(v=>v!=='other').map(v=>_PAY_DISPLAY[v]||v).join(', ')||'(selecting…)','user');

  if (_payTypesSel.includes('other')) {
    await speak("What are the other ways? You can list more than one — just separate them with commas.", 600);
    const _otherRaw = await askTextOptional("e.g. Consulting fee, Bonus, Car allowance");
    if (_otherRaw) {
      const _otherNames = _otherRaw.split(',').map(n=>n.trim()).filter(Boolean);
      _otherNames.forEach((n,i)=>{
        const _k = 'other_'+n.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30)+(i>0?'_'+i:'');
        _payEntries.push({ key:_k, label:n, speak:n });
      });
      addBubble(_otherNames.join(', '),'user');
    }
  }

  A.owner_pay = {};
  let _totalMonthlyOwnerPay = 0;

  for (const _entry of _payEntries) {
    await speak(`For ${_entry.speak} — is this monthly, weekly, or yearly?`, 600);
    const _payFreq = await askChips([{label:'Monthly', value:'monthly'},{label:'Weekly', value:'weekly'},{label:'Yearly', value:'yearly'}]);
    addBubble(_payFreq === 'monthly' ? 'Monthly' : _payFreq === 'weekly' ? 'Weekly' : 'Yearly', 'user');
    await speak(`How much per ${_payFreq === 'yearly' ? 'year' : _payFreq}?`, 400);

  "benchmark_narrative": "2-3 sentence motivational paragraph about what surviving this long in their industry means. Reference their specific industry, location, and years. Direct and real, not fluffy.",
  "executive_summary": "3-4 sentence summary of their business situation — what they are doing well, their biggest risk area, and what the single most important priority is right now. Use their actual data. No generic advice."
}`;

  let aiResult = { benchmark_narrative: '', executive_summary: '' };
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: systemPrompt }], max_tokens: 400 }),
      signal: controller.signal
    });
    clearTimeout(timer);
    const data = await res.json();
    const match = (data.reply || '').match(/\{[\s\S]*\}/);
    if (match) aiResult = JSON.parse(match[0]);
  } catch(e) { console.warn('AI summary skipped:', e.message); }

  hideTyping();

  const payload = {
    contact: A.contact,
    partner: A.partner||null,
    // Profile
    q1: A.q1, q1b: A.q1b, q1b_label: A.q1b_label,
    q2: A.q2, q2_city: A.q2_city, q3: A.q3,
    // Revenue
    q4: A.q4, q4_years: A.q4_years||{}, q4_parsed: A.q4_parsed||{}, q4_growth: A.q4_growth,
    // Team
    q5: A.q5, growth_target_pct: A.growth_target_pct||null,
    // Pain
    pain1: A.pain1, pain2: A.pain2, pain3: A.pain3, primaryPain: A.primaryPain, painVotes: A.painVotes,
    // Diagnostics
    q6: A.q6, q6_scenario: A.q6_scenario,
    q7: A.q7, avg_check: A.avg_check||null, customer_split: A.customer_split||null,
    q8: A.q8,
    q9: A.q9, q9_adspend: A.q9_adspend, q9_leads: A.q9_leads, q9_close: A.q9_close,
    expense_breakdown: A.expense_breakdown||{},
    materials_pct: A.materials_pct||null, materials_markup_pct: A.materials_markup_pct||null,
    q10: A.q10, review_monitoring: A.review_monitoring, review_requests: A.review_requests,
    q11: A.q11, q11b: A.q11b, q11c: A.q11c, q11_other: A.q11_other||null,
    q12: A.q12,
    q13: A.q13, cash_flow: A.cash_flow, cashflow_tracking: A.cashflow_tracking,
    has_pl: A.has_pl, pl_usage: A.pl_usage||null,
    bank_personal_biz: A.bank_personal_biz||null, bank_multi_accounts: A.bank_multi_accounts||null, bank_account_types: A.bank_account_types||null,
    q14: A.q14,
    // Goals
    q15: A.q15, q15_primary: A.q15_primary, goal_3yr: A.goal_3yr, q15b: A.q15b, q_pain: A.q_pain||'',
    // Owner economics
    owner_pay: A.owner_pay||{}, owner_pay_enough: A.owner_pay_enough||null,
    q16: A.q16, q17: A.q17, q17_regular: A.q17_regular||0, q17_slots: A.q17_slots||{}, q18: A.q18,
    // Partner economics (multi-partner support)
    partners: A.partners||null,
    partner_pay: A.partner_pay||null, partner_pay_total: A.partner_pay_total||null,
    // Payroll health
    behind_on_payroll: A.behind_on_payroll||null,
    behind_payroll_days: A.behind_payroll_days||null,
    // Team capacity
    cap_team_based: A.cap_team_based||null,
    cap_utilization: A.cap_utilization||null,
    cap_extra_jobs_week: A.cap_extra_jobs_week||null,
    cap_current_clients: A.cap_current_clients||null,
    cap_extra_clients: A.cap_extra_clients||null,
    cap_solo_headroom: A.cap_solo_headroom||null,
    // Current software stack
    current_software: A.current_software||null,
    // Team details
    salary_mode: A.salary_mode||'average',
    q19: A.q19, q19_segments: A.q19_segments, q19_total: A.q19_total, q19_headcount: A.q19_headcount,
    // Misc
    company_confirmed: A.company_confirmed||false,
    ai_benchmark: aiResult.benchmark_narrative,
    ai_summary: aiResult.executive_summary
  };

  localStorage.setItem('nexvora_assessment', JSON.stringify(payload));

  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const reportUrl = `${window.location.origin}/report.html?d=${encoded}`;

  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progLabel').textContent = 'Researching your business…';

  async function showStep(icon, text, delay=900) {
    await sleep(300);
    addBubble(`<span style="opacity:.55;font-size:13px;">${icon} ${text}</span>`, 'bot', true);
    await sleep(delay);
  }
  await showStep('✓', 'Answers saved — starting research…', 600);
  await showStep('🔍', `Searching for ${A.contact.company||A.contact.name+"'s business"} online…`, 800);
  await showStep('📊', 'Pulling industry benchmarks for your area…', 700);
  await showStep('✍️', 'Writing your personalized report…', 500);

  let shortUrl = reportUrl;
  try {
    const saveRes = await fetch('/api/save-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (saveRes.ok) {
      const saveData = await saveRes.json();
      if (saveData.id) shortUrl = `${window.location.origin}/r/${saveData.id}`;
    }
  } catch(e) { console.warn('[save-report] failed:', e.message); }

  let deepReportUrl = null;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 90000);
    const grRes = await fetch('/api/generate-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode:'assessment', assessment: payload }),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (grRes.ok) {
      const grData = await grRes.json();
      if (grData.reportUrl) deepReportUrl = grData.reportUrl;
    }
  } catch(e) { console.warn('[generate-report] skipped:', e.message); }

  try {
    await fetch('/api/ghl', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, reportUrl: deepReportUrl||shortUrl })
    });
  } catch(e) { console.warn('[GHL] failed:', e.message); }

  document.getElementById('progLabel').textContent = 'Complete';
  addBubble(`Your report is ready, ${A.contact.name.split(' ')[0]}! Taking you there now…`, 'bot');
  await sleep(1000);
  window.location.href = deepReportUrl || `report.html?d=${encoded}`;
}


// iOS Safari viewport fix — visualViewport.height is the only reliable API
// window.innerHeight includes browser chrome on iOS; visualViewport.height does not
function setAppHeight() {
  var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
setAppHeight();
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setAppHeight);
  window.visualViewport.addEventListener('scroll', setAppHeight);
}
window.addEventListener('resize', setAppHeight);
setTimeout(setAppHeight, 300);

main().catch(err => {
  console.error('Assessment flow error:', err);
  hideTyping();
  document.getElementById('inputArea').style.display = 'none';
  const inner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'brow bot';
  row.innerHTML = '<div class="avatar">NX</div><div class="bbl bot">Something went wrong. Please refresh the page and try again.</div>';
  inner.appendChild(row);
});
</script>
